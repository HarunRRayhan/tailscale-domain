[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tailscale-domain"
version = "0.1.0"
description = "Tailscale domain route helper for local subdomains"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tsd = "tsd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
